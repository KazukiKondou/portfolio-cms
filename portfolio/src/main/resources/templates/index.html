<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${settings['site.title']} — Portfolio|">Kondo — Portfolio</title>
  <th:block th:replace="~{fragments/site :: meta(
      ${settings['site.title'] + ' — Portfolio'},
      ${seo.summarize(settings['hero.intro'], 120)},
      '/')}"></th:block>
  <link rel="stylesheet" th:href="@{/css/main.css}">

  <!-- 検索エンジンに「誰のサイトか」を伝える構造化データ -->
  <script type="application/ld+json" th:inline="javascript">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": [[${settings['site.title']}]],
      "jobTitle": [[${settings['hero.tagline']}]],
      "description": [[${settings['hero.intro']}]],
      "url": [[${baseUrl}]]
    }
  </script>
</head>

<body>

  <header th:replace="~{fragments/site :: header}"></header>

  <main>
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-text">
          <h1><span th:text="${settings['site.title']}">Kondo</span><span class="accent-dot">.</span></h1>
          <p class="lead" th:text="${settings['hero.tagline']}">Software Engineer / 静岡</p>
          <p class="intro" th:text="${settings['hero.intro']}">
            Web を中心にバックエンド〜インフラまで触っているエンジニアです。
            最近は Spring Boot と TypeScript を使うことが多いです。
          </p>
        </div>
        <div class="hero-photo">
          <img th:if="${!#strings.isEmpty(settings['hero.photoUrl'])}"
               th:src="${settings['hero.photoUrl']}" th:alt="${settings['site.title']}"
               class="hero-photo-img" width="240" height="240" loading="lazy">
        </div>
      </div>
    </section>
  </main>

  <footer th:replace="~{fragments/site :: footer}"></footer>

</body>

</html>
