<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|Contact — ${settings['site.title']}|">Contact — Kondo</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

  <header th:replace="~{fragments/site :: header}"></header>

  <main>
    <section class="contact">
      <div class="container">
        <h1 class="page-title">Contact</h1>
        <p class="hint">ご連絡いただければなるべく早く返信します。</p>

        <div th:if="${submitted}" class="alert alert-info">
          メッセージを受け付けました。ありがとうございます。
        </div>

        <form method="post" th:action="@{/contact}" th:object="${contactForm}" class="edit-form">
          <div class="form-row">
            <label for="name"><span class="form-label">お名前</span></label>
            <input type="text" id="name" th:field="*{name}" maxlength="100" required>
            <p class="form-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">エラー</p>
          </div>

          <div class="form-row">
            <label for="email"><span class="form-label">メールアドレス</span></label>
            <input type="email" id="email" th:field="*{email}" maxlength="255" required>
            <p class="form-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">エラー</p>
          </div>

          <div class="form-row">
            <label for="message"><span class="form-label">メッセージ</span></label>
            <textarea id="message" th:field="*{message}" maxlength="5000" rows="8" required></textarea>
            <p class="form-error" th:if="${#fields.hasErrors('message')}" th:errors="*{message}">エラー</p>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn-primary">送信</button>
          </div>
        </form>

        <div class="contact-links" th:if="${!#strings.isEmpty(settings['contact.github'])}">
          <a class="contact-link" th:href="${settings['contact.github']}" target="_blank" rel="noopener noreferrer">
            <svg class="contact-link-icon" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span>GitHub</span>
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer th:replace="~{fragments/site :: footer}"></footer>

</body>

</html>
