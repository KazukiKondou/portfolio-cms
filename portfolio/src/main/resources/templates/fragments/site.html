<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>

  <!-- 検索結果や SNS 共有時の見え方をそろえる。ページの表示内容そのものは変えない -->
  <th:block th:fragment="meta(pageTitle, description, path)">
    <meta name="description" th:content="${description}">
    <link rel="canonical" th:href="${baseUrl + path}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" th:content="${settings['site.title']}">
    <meta property="og:title" th:content="${pageTitle}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:url" th:content="${baseUrl + path}">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:image"
          th:if="${!#strings.isEmpty(settings['hero.photoUrl']) and #strings.startsWith(settings['hero.photoUrl'], '/')}"
          th:content="${baseUrl + settings['hero.photoUrl']}">
    <meta name="twitter:card" content="summary">
  </th:block>

</head>

<body>

  <header th:fragment="header" class="site-header">
    <div class="container">
      <a href="/" class="site-name" th:text="${settings['site.title']}">Kondo</a>
      <nav class="site-nav">
        <a href="/" th:text="${settings['nav.home']}">Home</a>
        <a href="/works" th:text="${settings['nav.works']}">Works</a>
        <a href="/about" th:text="${settings['nav.about']}">About</a>
        <a href="/contact" th:text="${settings['nav.contact']}">Contact</a>
      </nav>
    </div>
  </header>

  <footer th:fragment="footer" class="site-footer">
    <div class="container">
      <p th:text="${settings['footer.copyright']}">&copy; 2026 Kondo</p>
    </div>
  </footer>

</body>

</html>
