<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|About — ${settings['site.title']}|">About — Kondo</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

  <header th:replace="~{fragments/site :: header}"></header>

  <main>
    <section class="about">
      <div class="container">
        <h1 class="page-title">About</h1>

        <div class="about-bio">
          <p th:each="para : ${aboutBioParagraphs}" th:text="${para}">
            自己紹介テキストの段落
          </p>
        </div>

        <div class="about-social" th:if="${!#strings.isEmpty(settings['social.github'])}">
          <a class="social-link" th:href="${settings['social.github']}" target="_blank" rel="noopener noreferrer">
            <svg class="social-link-icon" viewBox="0 0 16 16" width="20" height="20" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
            <span>GitHub</span>
          </a>
        </div>

        <h2 class="section-title">Timeline</h2>
        <ol class="timeline-list">
          <li class="timeline-item" th:each="ev : ${timelineEvents}">
            <span class="timeline-marker"></span>
            <div class="timeline-content">
              <span class="timeline-date" th:text="${ev.dateLabel}">2018年4月</span>
              <h3 class="timeline-title" th:text="${ev.title}">大学入学</h3>
              <p class="timeline-description"
                 th:if="${!#strings.isEmpty(ev.description)}"
                 th:text="${ev.description}">説明</p>
              <div class="timeline-tags" th:if="${!ev.tagList.empty}">
                <span class="timeline-tag"
                      th:each="tag : ${ev.tagList}"
                      th:text="${tag}">Java</span>
              </div>
            </div>
          </li>
        </ol>

        <h2 class="section-title">Skills</h2>
        <div class="proficiency-groups">
          <div class="proficiency-group" th:each="group : ${proficiencyGroups}">
            <div class="proficiency-header">
              <span class="dots" th:text="${group.dotsString()}">●●●</span>
              <span class="proficiency-label" th:text="${group.label}">主力</span>
            </div>
            <p class="skill-list" th:text="${group.skillsJoined}">Java · Spring Boot · TypeScript</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer th:replace="~{fragments/site :: footer}"></footer>

</body>

</html>
