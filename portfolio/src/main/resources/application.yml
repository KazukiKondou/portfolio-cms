spring:
  application:
    name: portfolio-site

  # 開発時は H2 ファイルモード。AUTO_SERVER=TRUE で site と admin を同じDBに繋ぐ
  # 本番では PostgreSQL に切り替える (application-prod.yml)
  datasource:
    url: jdbc:h2:file:${user.home}/portfolio-cms-data/portfolio;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

  # 外部への HTTP 呼び出し (Discord Webhook) がいつまでも待たないようにする
  http:
    client:
      connect-timeout: 3s
      read-timeout: 5s

server:
  port: 8080

portfolio:
  site:
    # canonical / og:url / sitemap.xml で使う公開URL
    base-url: ${SITE_BASE_URL:https://kazukikondo.com}

  notification:
    discord:
      # お問い合わせ受信を飛ばす Discord の Webhook URL。未設定なら通知しない
      webhook-url: ${DISCORD_WEBHOOK_URL:}
      # 通知カードのタイトルからリンクする管理画面の URL (任意)
      admin-url: ${PORTFOLIO_ADMIN_URL:}
