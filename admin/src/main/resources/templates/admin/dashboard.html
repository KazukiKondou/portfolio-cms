<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ダッシュボード — Admin</title>
  <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>

  <header th:replace="~{fragments/admin :: header}"></header>

  <main>
    <section class="admin-dashboard">
      <div class="container">
        <h1 class="page-title">ダッシュボード</h1>
        <p class="welcome">こんにちは、<span sec:authentication="name">admin</span> さん。</p>

        <h2 class="section-title">編集メニュー</h2>
        <ul class="admin-menu">
          <li><a href="/admin/settings">サイト設定（文言）</a></li>
          <li><a href="/admin/media">顔写真</a></li>
          <li><a href="/admin/works">作品一覧</a></li>
          <li><a href="/admin/skills">スキル</a></li>
          <li><a href="/admin/timeline">Timeline (略歴)</a></li>
          <li><a href="/admin/messages">お問い合わせ</a></li>
        </ul>

        <h2 class="section-title">アクセス数</h2>
        <p class="welcome">
          公開サイトの表示回数。合計 <strong th:text="${totalViews}">0</strong> 回。
        </p>

        <p th:if="${pageViews.empty}" class="hint">まだ記録がありません。</p>

        <ul class="admin-list" th:unless="${pageViews.empty}">
          <li class="admin-list-item" th:each="pv : ${pageViews}">
            <div>
              <span class="item-title" th:text="${pv.pagePath}">/</span>
              <p class="item-meta">
                最終アクセス
                <span th:text="${#temporals.format(pv.updatedAt, 'yyyy-MM-dd HH:mm')}">日時</span>
              </p>
            </div>
            <div class="item-actions">
              <span th:text="${pv.viewCount} + ' 回'">0 回</span>
            </div>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <footer th:replace="~{fragments/admin :: footer}"></footer>

</body>

</html>
